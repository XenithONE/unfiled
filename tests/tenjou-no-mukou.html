<!doctype html><html lang="ja"><meta charset="utf-8"><title>天井のむこう — browser acceptance checks</title>
<style>body{background:#171919;color:#e3e1d7;font:14px/1.7 system-ui;margin:24px}button{padding:14px 24px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #555;width:960px;height:720px;margin:24px 0}#results{max-width:1100px}.pass{color:#b6d5a9}.fail{color:#ff9d9d}</style>
<h1>天井のむこう — browser acceptance checks</h1><p>Local-only regression harness. Runs the actual comic in a same-origin iframe, simulates input events, observes rendered DOM and scroll positions, and renders the production audio code offline.</p>
<button id="run">Run checks</button><pre id="results"></pre><iframe id="app" title="Comic under test"></iframe>
<script type="module">
const soundModuleUrl = '/comics/tenjou-no-mukou/sound.js';
const { ComicSound } = await import(/* @vite-ignore */ soundModuleUrl);
const output = document.querySelector('#results');
const frame = document.querySelector('#app');
const result = { checks: [], frames: [], motion: [], audio: [] };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const wait = async (fn, timeout=7000) => { const start=performance.now(); while(!fn()){if(performance.now()-start>timeout)throw Error('Condition timed out');await sleep(20);} };
const log = (name, ok, details='') => { result.checks.push({name,ok,details}); output.textContent=JSON.stringify(result,null,2); if(!ok)throw Error(name+': '+details); };
const win=()=>frame.contentWindow, doc=()=>frame.contentDocument;
const phase=()=>doc().body.dataset.phase;
const click=id=>doc().querySelector(id).click();
const wheel=(deltaY)=>win().dispatchEvent(new (win().WheelEvent)('wheel',{deltaY,cancelable:true}));
const key=(key)=>win().dispatchEvent(new (win().KeyboardEvent)('keydown',{key,cancelable:true}));
async function load() {frame.removeAttribute('srcdoc');frame.src='/comics/tenjou-no-mukou/index.html?acceptance='+Date.now();await wait(()=>doc()?.querySelectorAll('.attack-step').length===36);await sleep(180);}
async function discover(){win().scrollTo({top:doc().documentElement.scrollHeight,behavior:'instant'});await wait(()=>phase()==='discovery');await sleep(450);}
async function restart(){click('#start');await sleep(100);await discover();}
function touch(type,y){const event=new (win().Event)(type,{bubbles:true,cancelable:true});Object.defineProperty(event,'touches',{value:[{clientY:y}]});win().dispatchEvent(event);}

document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 try {
  await load();
  const reduced=win().matchMedia('(prefers-reduced-motion: reduce)').matches;
  log('Motion is initially enabled without changing settings',doc().body.dataset.motion==='on','OS reduced-motion='+reduced);
  log('No sound/motion switches or quiet-start option',!doc().querySelector('#motion-toggle,#sound-toggle,#quiet-start'));
  log('Narrative waits for the audio-start gesture',doc().querySelector('#story').hidden);
  wheel(120); await sleep(80); log('No automatic attack before start',phase()==='idle');
  for (const width of [390,768,1366]) {frame.style.width=width+'px';await sleep(80);log('No horizontal overflow at '+width,doc().documentElement.scrollWidth<=win().innerWidth);}
  frame.style.width='960px';await sleep(80);
  click('#start');await wait(()=>doc().body.dataset.audioState==='running');
  log('Start activates audio and motion together',doc().body.dataset.audioState==='running'&&doc().body.dataset.motion==='on'&&!doc().querySelector('#story').hidden);
  log('Start focuses narrative for keyboard reading',doc().activeElement.id==='story');
  await discover();wheel(-50);await sleep(220);log('Upward scroll does not trigger attack',phase()==='discovery');
  const observer=new MutationObserver(()=>{const f=doc().body.dataset.frame;if(f!==undefined&&!result.frames.some(x=>x.frame===Number(f)))result.frames.push({frame:Number(f),y:win().scrollY,t:performance.now()});});
  observer.observe(doc().body,{attributes:true,attributeFilter:['data-frame']});
  wheel(40);
  const sample=()=>{if(phase()!=='attacking')return;const stage=doc().querySelector('#approach');result.motion.push({frame:Number(doc().body.dataset.frame),y:win().scrollY,floor:Number(stage.dataset.floor),height:Number(stage.dataset.ghostHeight),ghostY:Number(stage.dataset.ghostY)});win().requestAnimationFrame(sample);};
  win().requestAnimationFrame(sample);await wait(()=>phase()==='ending');observer.disconnect();
  log('All 36 different frames displayed in order',result.frames.map(x=>x.frame).join(',')===Array.from({length:36},(_,i)=>i).join(','));
  log('Real page scroll advances for every frame',result.frames.every((x,i)=>i===0||x.y>result.frames[i-1].y));
  log('Floor scroll continues between pose changes',result.motion.some((x,i)=>i>0&&x.frame===result.motion[i-1].frame&&x.y>result.motion[i-1].y));
  log('Ghost grows throughout approach',result.motion.every((x,i)=>i===0||x.height>=result.motion[i-1].height));
  log('Floor disappears while ghost remains visible',result.motion.some(x=>x.frame>=25&&x.floor===0&&x.height>400));
  log('Continuous floor travels over two viewport heights',result.motion.at(-1).y-result.motion[0].y>win().innerHeight*2);
  log('Last ghost fills the viewport',result.motion.at(-1).height>win().innerHeight);
  log('Ending releases automatic controls',!doc().documentElement.hasAttribute('data-controlled')&&doc().querySelector('#stop').hidden);
  log('Final frame uses separate detailed artwork',getComputedStyle(doc().querySelector('#approach [data-frame="35"] .attack-art')).backgroundImage.includes('final.webp'));
  const elapsed=result.frames.at(-1).t-result.frames[0].t;
  log('Faster approach retains all 36 frames within 0.8 seconds',elapsed>500&&elapsed<800,Math.round(elapsed)+' ms before final hold');
  click('#replay');await sleep(100);log('Replay enables motion without a setting',phase()==='reading'&&doc().body.dataset.motion==='on');
  log('Replay keeps audio running',doc().body.dataset.audioState==='running');
  await discover();key('PageDown');await sleep(40);log('Keyboard starts approach',phase()==='attacking');
  key('Escape');const escapedY=win().scrollY;await sleep(1200);log('Escape cancels frames and timers',phase()==='static'&&!doc().documentElement.hasAttribute('data-controlled')&&win().scrollY===escapedY);
  await restart();touch('touchstart',600);touch('touchmove',550);await sleep(50);log('Fresh upward finger swipe starts approach',phase()==='attacking');click('#stop');log('Visible stop switches to readable stills',phase()==='static'&&!doc().querySelector('#approach').hidden);
  await restart();wheel(70);await sleep(40);Object.defineProperty(doc(),'hidden',{configurable:true,value:true});doc().dispatchEvent(new (win().Event)('visibilitychange'));log('Hidden document cancels approach',phase()==='static');await wait(()=>doc().body.dataset.audioState==='suspended');delete doc().hidden;doc().dispatchEvent(new (win().Event)('visibilitychange'));await wait(()=>doc().body.dataset.audioState==='running');log('Visibility return resumes sound without a switch',doc().body.dataset.audioState==='running');log('Visibility return does not rearm',phase()==='static');
  await restart();wheel(70);await sleep(40);frame.style.width='390px';await sleep(180);log('Orientation/width change cancels approach',phase()==='static');
  click('#replay');await wait(()=>doc().body.dataset.audioState==='running');log('Reading again after cancellation restores both effects',phase()==='reading'&&doc().body.dataset.motion==='on'&&doc().body.dataset.audioState==='running');

  for(const name of ['rush-1','rush-2','rush-3','rush-4','final']) {
    const img=new Image();img.src='/comics/tenjou-no-mukou/art/ghost-'+name+'.webp';await img.decode();const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const rgba=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,solid=0;for(let i=3;i<rgba.length;i+=4){if(rgba[i]===0)clear++;if(rgba[i]>220)solid++;}log('Ghost '+name+' has real transparency and visible artwork',clear>canvas.width*canvas.height*.1&&solid>canvas.width*canvas.height*.02);
  }
  const audioFiles=await ComicSound.fetchFiles();
  log('All four PCM files download',audioFiles.every(([,bytes])=>bytes?.byteLength>100000));
  for(const cue of ['shatter','phone','silence','knock','ladder','attic','head','step','rush','voice','impact']) {
   const context=new OfflineAudioContext(1,48000*3,48000);const sound=new ComicSound(context);await sound.load(audioFiles);sound.play(cue);const rendered=await context.startRendering();const samples=rendered.getChannelData(0);let peak=0,sum=0;for(const value of samples){peak=Math.max(peak,Math.abs(value));sum+=value*value;}const rms=Math.sqrt(sum/samples.length);result.audio.push({cue,peak:Number(peak.toFixed(6)),rms:Number(rms.toFixed(6))});log('Audio '+cue+' is non-silent and unclipped',peak>0.0001&&peak<0.99&&Number.isFinite(rms));
  }
  const phoneContext=new OfflineAudioContext(2,48000,48000);const phoneSound=new ComicSound(phoneContext);await phoneSound.load(audioFiles);phoneSound.play('phone');log('Telephone repeats until answered',[...phoneSound.sources.keys()].some(x=>x.loop));phoneSound.play('silence');log('Receiver stops the mechanical bell immediately',![...phoneSound.sources.values()].some(x=>x.group==='phone'));
  const mixContext=new OfflineAudioContext(2,48000*2,48000);const mix=new ComicSound(mixContext);await mix.load(audioFiles);mix.play('voice');mix.setApproach(1);mix.play('impact');log('Final impact retains throat voice',!!mix.voice&&mix.sources.has(mix.voice.source));const mixRendered=await mixContext.startRendering();let mixPeak=0;for(let c=0;c<2;c++)for(const value of mixRendered.getChannelData(c))mixPeak=Math.max(mixPeak,Math.abs(value));log('Voice plus impact retains headroom',mixPeak>0.02&&mixPeak<.99,mixPeak.toFixed(5));
  const muteContext=new OfflineAudioContext(1,48000,48000);const muted=new ComicSound(muteContext);await muted.load(audioFiles);muted.play('voice');muted.play('phone');muted.setEnabled(false);muted.play('impact');log('Mute cancels loops and scheduled sources',muted.sources.size===0);const silence=await muteContext.startRendering();log('Muted effect produces zero samples',silence.getChannelData(0).every(x=>x===0));
  const fallbackContext=new OfflineAudioContext(1,48000,48000);const fallback=new ComicSound(fallbackContext);await fallback.load(Promise.resolve([['shatter',null],['phone',null],['wood',null],['voice',null]]));fallback.play('shatter');const fallRendered=await fallbackContext.startRendering();log('Audio download failure keeps fallback sound usable',fallRendered.getChannelData(0).some(x=>Math.abs(x)>.001));
  const original=await fetch('/comics/tenjou-no-mukou/index.html').then(r=>r.text());
  frame.srcdoc=original.replace('<head>','<head><base href="/__missing_comic_assets__/">').replace(/href="\.\/comic\.css[^"]*"/,'href="/comics/tenjou-no-mukou/comic.css"').replace(/src="\.\/comic\.js[^"]*"/,'src="/comics/tenjou-no-mukou/comic.js"');
  await wait(()=>doc()?.querySelector('#load-status')?.textContent.includes('読み込めません'));
  log('Missing art disables automatic sequence',doc().body.dataset.motion==='off');
  click('#start');log('Missing art leaves static narrative usable',phase()==='static'&&!doc().querySelector('#ending').hidden);
  output.className='pass';result.status='passed';
 }catch(error){result.status='failed';result.error=String(error);output.className='fail';}
 output.textContent=JSON.stringify(result,null,2);document.body.dataset.result=result.status;document.querySelector('#run').disabled=false;
};
</script></html>
